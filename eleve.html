<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- OUTILS_TEST_V38 : chargé AVANT tout autre script (il décale l'horloge). À retirer avec le reste de l'outillage. -->
<!-- TUILE_RITUEL_V46 : la table du plan (classe -> chapitre date -> refs). 12,7 ko, deja
     en ligne. Elle sert ICI a une seule chose : ne montrer la tuile du rituel qu'aux
     classes que le plan sert vraiment. Son absence ne casse rien (repli assume). -->
<script src="plan_reco_v45.js"></script>
<script src="pcmajo_test.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b6cb0">
<title>Espace élève — PC Majorelle</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#15202b;--muted:#5c6b7a;--line:#dbe2ea;--accent:#2b6cb0;}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1620;--card:#16222f;--ink:#e8eef6;--muted:#9fb0c3;--line:#26374a;--accent:#2b6cb0;}}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);
    padding:0 16px calc(28px + env(safe-area-inset-bottom))}
  header{margin:0 -16px 20px;background:var(--accent);color:var(--onaccent,#fff);padding:calc(14px + env(safe-area-inset-top)) 14px 14px;display:flex;align-items:center;gap:10px}
  header .home{color:#fff;text-decoration:none;font-size:18px;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:2px 9px}
  header h1{margin:0;font-size:18px;font-weight:600}
  .grid{display:grid;gap:12px;max-width:620px;margin:0 auto}
  a.tile{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:inherit}
  .tile.soon{opacity:.55;pointer-events:none}
  .ic{width:46px;height:46px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:23px;background:var(--accent);color:var(--onaccent,#fff)}
  .tile b{display:block;font-size:16px;font-weight:600} .tile span{font-size:13px;color:var(--muted)}
  .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:1px 7px;margin-left:6px}
  .note{max-width:620px;margin:18px auto 0;font-size:12px;color:var(--muted);text-align:center}
  .pdfsec{max-width:620px;margin:22px auto 0}
  .pdfsec h2{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px;text-align:center}
  .pdfrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .pdfrow a{font-size:12px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:5px 10px;background:var(--card);line-height:1.2}
  .pdfrow a.cur{font-weight:700;border-color:var(--accent)}
</style>
<style id="pctheme-css">
  .thsw{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:10px;padding:6px 9px;margin:5px 6px 0 0;cursor:pointer;font:inherit;font-size:12px;background:var(--card);color:var(--ink);line-height:1;transition:transform .08s}
  .thsw:active{transform:scale(.96)}
  .thsw span.sw{width:15px;height:15px;border-radius:50%;display:inline-block;flex:0 0 auto}
  .thsw[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:1px;font-weight:600}
  .themebtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:21px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.18)}
  .themepop{position:fixed;right:14px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:60;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;max-width:290px;box-shadow:0 8px 28px rgba(0,0,0,.22);display:none}
  .themepop.open{display:block}
  .themepop h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
</style>
</head>
<body>
<header><a class="home" href="index.html" aria-label="Portail">‹</a><h1 id="h1">Espace élève</h1></header>
<div class="grid" id="grid"></div>
<section class="pdfsec" id="pdfsec" hidden></section>
<p class="note" id="softnote" hidden></p>
<p class="note">Bientôt : accès direct au portail de ta classe par QR.</p>
<div id="pcmajo-regle-ici"><!-- FOND_REACTIF_V49 : la regle du fond se pose ici --></div>
<script>(function(){
  var LAB={
    "2G3":"2nde G3","2G6":"2nde G6",
    "1PC":"1re spé PC",
    "TSTI2D":"Tale STI2D","1STI2D":"1re STI2D",
    "TG1":"Tale G1","TG5":"Tale G5","TG6":"Tale G6",
    "1G4":"1re G4"
  };
  var LS="pcmajo_acces";

  /* --- code de classe : ?classe= puis pcmajo_acces (session, puis local) --- */
  var p=new URLSearchParams(location.search);var code=p.get("classe");
  if(!code){
    var s=null;
    try{s=JSON.parse(sessionStorage.getItem(LS));}catch(e){}
    if(!s){try{s=JSON.parse(localStorage.getItem(LS));}catch(e){}}
    if(s&&s.role==="eleve")code=s.code;
  }

  /* --- titre --- */
  if(code)document.getElementById("h1").textContent="Espace élève — PC · "+(LAB[code]||code);

  /* --- mappe le code de classe vers un jeton de niveau de la coque --- */
  function niveauToken(c){
    if(!c)return null;
    c=String(c).toUpperCase();
    if(c.indexOf("2G")===0)return "2nde";
    if(c.indexOf("1PC")===0)return "spe1";
    if(c.indexOf("TPC")===0||c.indexOf("TSPE")===0)return "speT";
    if(c.indexOf("1STI")===0)return "sti1";
    if(c.indexOf("TSTI")===0||c.indexOf("TSISPH")===0||(c.charAt(0)==="T"&&c.charAt(1)==="S"&&c.charAt(2)==="I"))return "stiT";
    if(c.indexOf("NSI")!==-1)return null;
    if(c.indexOf("1G")===0)return "ens1";
    if(c.indexOf("TG")===0)return "ensT";
    /* RENTREE_ELEVE_V38 — les identifiants de 2026-2027 n'étaient reconnus par AUCUNE de ces
       règles : `2NDE-1`, `1ENS-3`, `TENS-4`, `1PC-G2`, `TSPE-PHY1` retombaient sur `null`,
       c'est-à-dire un espace élève amputé de « Réviser par niveau », des fiches et des
       séquences. Défaut révélé en éprouvant le sélecteur de test sur TOUTES les classes —
       il ne se voyait pas tant qu'on ne testait que les 6 classes à codes de 2025-2026. */
    if(c.indexOf("2NDE")===0)return "2nde";
    if(c.indexOf("1ENS")===0)return "ens1";
    if(c.indexOf("TENS")===0)return "ensT";
    return null;
  }
  var tok=niveauToken(code);

  /* --- tuiles --- */
  function tile(href,icon,title,sub,soon,tag){
    var t=tag?' <span class="tag">'+tag+'</span>':'';
    var cls=soon?'tile soon':'tile';
    return '<a class="'+cls+'" href="'+href+'"><span class="ic">'+icon+'</span>'+
           '<span><b>'+title+t+'</b><span>'+sub+'</span></span></a>';
  }

  var grid=document.getElementById("grid");
  var html="";

  if(tok){
    /*TUILE_REVISION_V42*/
    /* Révision du soir — TOUS LES NIVEAUX (v42). Remplace le rituel réservé à la Tale
       STI2D : celui-ci portait 12 questions codées en dur sur un seul chapitre, la
       nouvelle page engendre ses exercices depuis les 671 patrons du moteur.
       `revision_sti2d_tale.html` reste sur le disque (rien n'est supprimé) mais n'est
       plus la porte d'entrée. On passe le CODE DE CLASSE, pas le jeton : la page en
       déduit le niveau et y retrouve aussi sa classe dans le plan publié (D-S4).
       Pas de tuile en enseignement scientifique : la banque ne contient AUCUN patron
       pour ens1/ensT (mesuré : 0 sur 671). Une tuile qui ouvre sur « pas encore
       d'exercices » est une promesse vide — on ne la montre pas. */
    /*TUILE_RITUEL_V46*/
    /* La tuile menait a `revision.html` — l'exerciseur de v42, qui FAIT CALCULER. C'est le
       chemin que Laurent a pris en ouvrant le portail eleve, et c'est pourquoi il a cru a une
       regression : le rituel du soir, lui, ne fait pas calculer, il fait RECONNAITRE (D-S9).
       Desormais : si la classe de l'eleve est jouable dans le plan publie, la tuile ouvre le
       rituel ; SINON on ne touche a rien — les trois niveaux de Premiere, qu'aucune classe du
       plan ne sert (270 capacites, cf. §4.3 du relais v46), gardent exactement la tuile qu'ils
       avaient. On n'enleve rien, et on ne promet rien de vide. */
    var cidPlan = (function(){
      var P = window.PCMAJO_RECO_PLAN;
      if(!P || !P.classes) return null;
      var jouables = [], id, cl, n;
      for(id in P.classes){
        cl = P.classes[id]; n = 0;
        (cl.chapitres||[]).forEach(function(ch){ n += (ch.refs||[]).length; });
        if(n>0) jouables.push({cid:id, niveau:cl.niveau});
      }
      var c = String(code||"").toUpperCase(), i;
      for(i=0;i<jouables.length;i++) if(jouables[i].cid===c) return jouables[i].cid;
      var NIV={ "2nde":"2nde", "spe1":"1spe", "speT":"Tspe", "sti1":"1sti",
                "stiT":"Tsti", "ens1":"1ens", "ensT":"Tens" }[tok];
      if(!NIV) return null;
      for(i=0;i<jouables.length;i++) if(jouables[i].niveau===NIV) return jouables[i].cid;
      return null;
    })();
    if(cidPlan){
      html+=tile("test_du_soir_v45.html?acces="+encodeURIComponent(code||""),"🎯","Révision du soir",
                 "Deux minutes, le soir du cours : on remet sous tes yeux ce qu'on a vu aujourd'hui.",false);
    }else if(tok!=="ens1"&&tok!=="ensT"){
      html+=tile("revision.html?acces="+encodeURIComponent(code||""),"🎯","Révision du soir",
                 "Quelques minutes, le soir du cours : des exercices tirés au sort rien que pour toi.",false);
    }
    /* Tes séquences : Seconde uniquement (18 séquences rédigées) */
    if(tok==="2nde"){
      html+=tile("prototype_sequences_2nde_v2.html","🧭","Tes séquences de l'année",
                 "Les 18 chapitres, dans l'ordre : ce qu'on cherche, ce qu'il faut retenir.",false,"Seconde");
    }
    /* Réviser par niveau : active */
    html+=tile("maquette_socle_unifie_v0.17.html?niveau="+tok+"&acces="+tok,"📚","Réviser par niveau",
               "Fiches de prérequis et exercices de ton niveau.",false);
    /* S'entraîner : toujours active */
    html+=tile("exerciseur_resolution.html","✏️","Aide à la résolution d'équations",   /*TUILE_RESOLUTION_V40 : l'ancien libellé « S'entraîner (exercices) » annonçait des exercices de PC ; cet outil est un entraînement TRANSVERSAL à la méthode, hors chapitre.*/
               "Résolution pas-à-pas, étape par étape.",false);
  }else{
    /* hors périmètre PC ou code inconnu : note douce + exercices seule tuile active */
    html+=tile("exerciseur_resolution.html","✏️","Aide à la résolution d'équations",   /*TUILE_RESOLUTION_V40 : l'ancien libellé « S'entraîner (exercices) » annonçait des exercices de PC ; cet outil est un entraînement TRANSVERSAL à la méthode, hors chapitre.*/
               "Résolution pas-à-pas, étape par étape.",false);
    var sn=document.getElementById("softnote");
    sn.textContent="Le contenu PC pour ta classe arrive bientôt.";
    sn.hidden=false;
  }
  grid.innerHTML=html;

  /* --- fiches de révision (PDF) --- */
  var CHAINS={
    cycle4:["revision_cycle4.pdf"],
    "2nde":["revision_2nde.pdf","revision_cycle4.pdf"],
    spe1:["revision_1spePC.pdf","revision_2nde.pdf","revision_cycle4.pdf"],
    speT:["revision_TspePC.pdf","revision_1spePC.pdf","revision_2nde.pdf","revision_cycle4.pdf"],
    sti1:["revision_1STI2D.pdf","revision_2nde.pdf","revision_cycle4.pdf"],
    stiT:["revision_TaleSTI2D.pdf","revision_1STI2D.pdf","revision_2nde.pdf","revision_cycle4.pdf"],
    ens1:["revision_2nde.pdf","revision_cycle4.pdf"],
    ensT:["revision_2nde.pdf","revision_cycle4.pdf"]
  };
  var PDFLAB={
    "revision_cycle4":"Cycle 4",
    "revision_2nde":"Seconde",
    "revision_1spePC":"1re spé PC",
    "revision_TspePC":"Tale spé PC",
    "revision_1STI2D":"1re STI2D",
    "revision_TaleSTI2D":"Tale STI2D"
  };
  var chain=tok?CHAINS[tok]:null;
  if(chain){
    var links=chain.map(function(pdf,i){
      var base=pdf.replace(/\.pdf$/,"");
      var lab=PDFLAB[base]||base;
      return '<a target="_blank" rel="noopener" href="fiches/'+pdf+'"'+(i===0?' class="cur"':'')+'>'+lab+'</a>';
    }).join("");
    var sec=document.getElementById("pdfsec");
    sec.innerHTML='<h2>Fiches de révision (PDF)</h2><div class="pdfrow">'+links+'</div>';
    sec.hidden=false;
  }
})();</script>
<!-- THEME_CONTRASTE_V38 : kit de thème PARTAGÉ. Sept pages en embarquaient chacune une copie
     inline ; la palette était la même mais chacune posait un jeu de variables différent. Source
     unique désormais : une palette à corriger, pas sept. -->
<script src="pcmajo_ui.js"></script>
<button class="themebtn" id="themeBtn" title="Thème de l'interface" aria-label="Changer le thème de l'interface">🎨</button>
<div class="themepop" id="themePop"><h4>Thème de l'interface</h4><div id="themePick"></div></div>
<script>(function(){var b=document.getElementById('themeBtn'),p=document.getElementById('themePop');if(!b||!window.PCTheme)return;PCTheme.swatches('themePick');b.addEventListener('click',function(e){e.stopPropagation();p.classList.toggle('open');});document.addEventListener('click',function(e){if(p.classList.contains('open')&&!p.contains(e.target)&&e.target!==b)p.classList.remove('open');});})();</script>
<!-- FOND_REACTIF_V49 : le fond raconte le travail fourni. Voir pcmajo_fond.js. -->
<script src="pcmajo_fond.js"></script>
<script>(function(){ if(window.PCFond){ PCFond.peindre(); PCFond.ligne("#pcmajo-regle-ici"); } })();</script>
</body>
</html>
