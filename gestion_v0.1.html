</head>
<body>
<header>
  <div class="hrow"><a href="prof.html" class="nc-home" aria-label="Espace prof">‹ Espace prof</a>
    <h1>👩‍🏫 <span id="gTitle">Gestion</span> <span class="sub">classes &amp; progression — Plateforme PC · Majorelle</span></h1>
    <div class="spacer"></div>
    <label class="small muted">Année</label>
    <select id="activeAnnee"></select>
    <button class="mini ghost" id="addAnnee" title="Ajouter une année scolaire">➕ année</button>
    <label class="small muted">Classe active</label>
    <select id="activeClass"></select>
    <!-- MENU_UNIQUE_GESTION_V38 : les deux boutons de sauvegarde vont ENSEMBLE. Séparés, la barre
         les renvoyait à la ligne l'un sans l'autre — « Enregistrer » en bout de ligne et
         « Importer » seul en dessous. Ils forment une paire : on les rend insécables. -->
    <span style="display:inline-flex;gap:6px;flex:0 0 auto;white-space:nowrap">
      <button class="mini ghost" id="btnSave" title="Enregistrer (télécharger l'état)">💾 Enregistrer</button>
      <button class="mini ghost" id="btnLoad" title="Importer un état">📂 Importer</button>
      <input type="file" id="fileIn" accept="application/json" style="display:none">
    </span>
  </div>
  <div class="row" id="propage" style="gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 2px"></div>
  <div class="tabs" id="tabs"><!--RATIONALIZE_V30 : onglets rangés par fréquence-->
    <div class="tab on" data-t="semaine">Semaine</div>
    <div class="tab" data-t="seances">Séances</div>
    <div class="tab" data-t="suivi">Suivi</div>
    <div class="tab" data-t="eleves">Élèves &amp; groupes</div>
    <div class="tab" data-t="comp">Compétences</div>
    <div class="tab" data-t="materiel">Matériel</div>
    <div class="tab" data-t="classes">Classes</div>
    <div class="tab" data-t="calendrier">Calendrier</div>
    <div class="tab" data-t="constr" title="Bâtir la progression (frise dates + arbre séances) — l'outil de préparation de l'année">🧭 Constructeur</div>
    <div class="tab" id="legacyToggle" title="Anciens outils de progression, remplacés par le Constructeur — conservés pour référence">⋯ Anciens outils ▾</div>
    <span id="legacyTabs" style="display:none">
      <div class="tab" data-t="prev">Prévisionnel</div>
      <div class="tab" data-t="plan">Plannings cohérents</div>
      <div class="tab" data-t="progressions">Progressions</div>
    </span>
  </div>
</header>
<main>
  <section class="panel on" id="p-semaine"></section>
  <section class="panel" id="p-classes"></section>
  <section class="panel" id="p-eleves"></section>
  <section class="panel" id="p-calendrier"></section>
  <section class="panel" id="p-seances"></section>
  <section class="panel" id="p-prev"></section>
  <section class="panel" id="p-suivi"></section>
  <section class="panel" id="p-materiel"></section>
  <section class="panel" id="p-plan"></section>
  <section class="panel" id="p-progressions"></section>
  <section class="panel" id="p-constr"></section>
  <section class="panel" id="p-comp"></section>
</main>
