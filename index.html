<style>

<header><h1>Plateforme PC — Majorelle</h1><p>Connexion</p></header>
<main>
  <div class="card">
    <div id="resume"></div>
    <h2>Se connecter</h2>
    <p class="sub">Entre ton <b>code d'accès</b> personnel (donné par ton prof, ou ton code enseignant).</p>
    <div class="err" id="err"></div>
    <label for="code">Code d'accès</label>
    <input id="code" type="text" autocapitalize="characters" autocomplete="off" placeholder="ex. AB12-CD34" inputmode="text">
    <div class="rowck"><input type="checkbox" id="remember" checked><label for="remember" style="margin:0">Se souvenir de moi sur cet appareil</label></div>
    <button class="btn" id="go">Se connecter</button>
    <p class="note">Codes personnels non devinables ; le site n'en garde que l'empreinte cryptée. Aucune donnée d'élève en ligne : tout reste sur l'appareil.</p>
  </div>
</main>

function norm(s){ return String(s||"").trim().toUpperCase().replace(/\s+/g,""); }
async function sha256hex(s){
  var buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.prototype.map.call(new Uint8Array(buf), function(b){return b.toString(16).padStart(2,"0");}).join("");
}
function goTo(a){ if(a.role==="prof") location.href="prof.html"; else location.href="eleve.html?classe="+encodeURIComponent(a.code); }
function store(a){ try{ localStorage.setItem(LS, JSON.stringify(a)); }catch(e){} }
async function resolve(raw){
  var code=norm(raw); if(!code) return null;
  var h=await sha256hex(code); var r=AUTH[h]; if(!r) return null;
  return (r.r==="p") ? {role:"prof", cl:(r.cl||[])} : {role:"eleve", code:r.c, eleve:code};
}
async function connect(){
  var a=await resolve(document.getElementById("code").value);
  if(!a){ var e=document.getElementById("err"); e.style.display="block"; e.textContent="Code non reconnu. Vérifie, ou demande-le à ton prof."; return; }
  try{sessionStorage.setItem(LS,JSON.stringify(a));}catch(x){}
  if(document.getElementById("remember").checked) store(a); else { try{localStorage.removeItem(LS);}catch(x){} }
  goTo(a);
}
document.getElementById("go").onclick=connect;
document.getElementById("code").addEventListener("keydown",function(e){ if(e.key==="Enter") connect(); });

/* connexion directe par lien / QR : ?code=XXXX-YYYY */
(function(){
  var p=new URLSearchParams(location.search); var code=p.get("code"); if(!code) return;
  resolve(code).then(function(a){ if(a){ try{sessionStorage.setItem(LS,JSON.stringify(a));}catch(x){} store(a); goTo(a); } });
})();

/* profil mémorisé -> "Continuer" */
(function(){
  var saved=null; try{ saved=JSON.parse(localStorage.getItem(LS)); }catch(e){}
  if(saved && saved.role){
    var who=saved.role==="prof"?"enseignant":("classe "+saved.code);
    document.getElementById("resume").innerHTML='<div class="resume">Déjà connecté : <b>'+who+'</b></div><button class="btn" id="cont">Continuer →</button><button class="btn sec" id="switch">Changer d\'accès</button><hr style="border:none;border-top:1px solid var(--line);margin:16px 0">';
    document.getElementById("cont").onclick=function(){ goTo(saved); };
    document.getElementById("switch").onclick=function(){ try{localStorage.removeItem(LS);}catch(e){} document.getElementById("resume").innerHTML=""; document.getElementById("code").focus(); };
  }
})();
