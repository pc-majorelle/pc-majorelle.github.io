<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12324a">
<title>Connexion — PC Majorelle</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#15202b;--muted:#5c6b7a;--line:#dbe2ea;--accent:#12324a;--bad:#e2554f;}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1620;--card:#16222f;--ink:#e8eef6;--muted:#9fb0c3;--line:#26374a;--accent:#1d3b57;}}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);
    min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--accent);color:#fff;padding:calc(26px + env(safe-area-inset-top)) 16px 26px;text-align:center}
  header h1{margin:0;font-size:20px;font-weight:600}
  header p{margin:5px 0 0;font-size:13px;opacity:.85}
  main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:380px}
  h2{margin:0 0 4px;font-size:18px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 5px}
  input{width:100%;font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;margin-bottom:14px}
  input:focus{outline:none;border-color:var(--accent)}
  .btn{width:100%;border:none;background:var(--accent);color:#fff;border-radius:10px;padding:13px;font-size:16px;font-weight:600;cursor:pointer}
  .btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line);margin-top:10px}
  .rowck{display:flex;align-items:center;gap:8px;margin:0 0 16px;font-size:14px;color:var(--muted)}
  .rowck input{width:auto;margin:0}
  .err{color:var(--bad);font-size:14px;margin:0 0 12px;display:none}
  .resume{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;font-size:14px}
  .note{color:var(--muted);font-size:12px;margin:16px 0 0;text-align:center}
</style>
</head>
<body>
<header><h1>Plateforme PC — Majorelle</h1><p>Connexion</p></header>
<main>
  <div class="card">
    <div id="resume"></div>
    <h2>Se connecter</h2>
    <p class="sub">Entre ton <b>code d'accès</b> (donné par ton prof, ou ton code enseignant).</p>
    <div class="err" id="err"></div>
    <label for="code">Code d'accès</label>
    <input id="code" type="text" autocapitalize="characters" autocomplete="off" placeholder="ex. 2G3" inputmode="text">
    <div class="rowck"><input type="checkbox" id="remember" checked><label for="remember" style="margin:0">Se souvenir de moi sur cet appareil</label></div>
    <button class="btn" id="go">Se connecter</button>
    <p class="note">Accès par code (filtre). Le mot de passe vérifié arrivera plus tard, sur le même écran. Aucune donnée d'élève n'est en ligne : tout reste sur l'appareil.</p>
  </div>
</main>
<script>
"use strict";
var LS="pcmajo_acces";
/* ======= CODES D'ACCÈS (modifiable — Laurent) ======= */
var PROFS   = { "agenor":"Agénor" };                   // codes profs (ajoute-en autant que de collègues)
var ANNEES  = {                                        // classes par rentrée (ajoute une année ici)
  "2025-2026": ["2G3","2G6","1PC","TSTI2D","TG5","TG6"]
};
var ANNEE_COURANTE = "2025-2026";                      // année en cours (à changer chaque rentrée)
var CLASSES = ANNEES[ANNEE_COURANTE] || [];            // codes élèves = classes de l'année courante
/* ==================================================== */

function resolve(raw){
  var code=(raw||"").trim(); if(!code) return {role:null};
  var pk=Object.keys(PROFS).filter(function(k){return k.toLowerCase()===code.toLowerCase();})[0];
  if(pk) return {role:"prof", code:pk, label:PROFS[pk]};
  var cl=CLASSES.filter(function(c){return c.toLowerCase()===code.toLowerCase();})[0];
  if(cl) return {role:"eleve", code:cl};
  return {role:null};
}
function goTo(r){ if(r.role==="prof") location.href="prof.html"; else location.href="eleve.html?classe="+encodeURIComponent(r.code); }

function connect(){
  var r=resolve(document.getElementById("code").value);
  if(!r.role){ var e=document.getElementById("err"); e.style.display="block"; e.textContent="Code non reconnu. Vérifie, ou demande-le à ton prof."; return; }
  if(document.getElementById("remember").checked){ try{ localStorage.setItem(LS, JSON.stringify(r)); }catch(x){} }
  else { try{ localStorage.removeItem(LS); }catch(x){} }
  goTo(r);
}
document.getElementById("go").onclick=connect;
document.getElementById("code").addEventListener("keydown",function(e){ if(e.key==="Enter") connect(); });

/* connexion directe par lien / QR : ?code=CLASSE (&eleve=CODE) */
(function(){
  var p=new URLSearchParams(location.search);
  var code=p.get("code"); if(!code) return;
  var r=resolve(code); if(!r.role) return;
  var el=p.get("eleve"); if(el) r.eleve=el;
  try{ localStorage.setItem(LS, JSON.stringify(r)); }catch(e){}
  goTo(r);
})();

/* profil mémorisé -> proposer "Continuer" (pas de redirection auto, pour pouvoir changer) */
(function(){
  var saved=null; try{ saved=JSON.parse(localStorage.getItem(LS)); }catch(e){}
  if(saved && saved.role){
    var who=saved.role==="prof"?("enseignant"):("classe "+saved.code);
    document.getElementById("resume").innerHTML=
      '<div class="resume">Déjà connecté : <b>'+who+'</b></div>'
      +'<button class="btn" id="cont">Continuer →</button>'
      +'<button class="btn sec" id="switch">Changer d\'accès</button><hr style="border:none;border-top:1px solid var(--line);margin:16px 0">';
    document.getElementById("cont").onclick=function(){ goTo(saved); };
    document.getElementById("switch").onclick=function(){ try{localStorage.removeItem(LS);}catch(e){} document.getElementById("resume").innerHTML=""; document.getElementById("code").focus(); };
  }
})();
</script>
</body>
</html>
